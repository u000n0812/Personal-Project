# ============================================================
# Commodity Quant - 설정 파일
# ============================================================

# 추적 대상 원자재 (yfinance 심볼 기준)
# 자산군별로 묶어서 관리한다.
assets:
  energy:
    CL=F: "WTI 원유"
    BZ=F: "Brent 원유"
    NG=F: "천연가스"
  precious_metals:
    GC=F: "금"
    SI=F: "은"
  industrial_metals:
    HG=F: "구리"
  agriculture:
    ZC=F: "옥수수"
    ZW=F: "밀"
    ZS=F: "대두"

# 데이터 소스: "yfinance" | "csv" | "synthetic"
#  - yfinance  : Yahoo Finance 온라인 수집 (네트워크 allowlist 필요)
#  - csv       : data/ 디렉터리의 <symbol>.csv 사용
#  - synthetic : 네트워크 없이 합성 데이터 생성 (오프라인 데모/테스트용)
data:
  source: synthetic
  start: "2018-01-01"
  end: null              # null 이면 오늘까지
  csv_dir: "data"
  cache_dir: "data/cache"
  synthetic_days: 1500   # synthetic 모드에서 생성할 일수

# 피처 엔지니어링
features:
  ma_windows: [5, 10, 20, 60]
  rsi_period: 14
  vol_window: 20

# 예측 설정
forecast:
  target: log_return     # 모델이 예측하는 대상 (현재는 log_return)
  horizon: 1             # 며칠 앞을 예측할지 (1 = 다음 거래일)

# 백테스트(워크-포워드) 설정
backtest:
  test_size: 120         # 마지막 N개 거래일을 검증 구간으로 사용
  refit_every: 5         # 모델을 며칠마다 재학습할지 (속도/정확도 trade-off)

# 사용할 모델 목록 (등록된 이름)
#  naive, arima, garch, xgboost, lstm
models:
  - naive
  - arima
  - garch
  - xgboost
  # - lstm   # torch 설치 시 활성화

# LSTM 하이퍼파라미터 (선택)
lstm:
  lookback: 20
  hidden_size: 32
  epochs: 30
  lr: 0.001

# ============================================================
# 금(Gold) 매크로 트레이딩 전략
#   금 = f( 실질금리, 달러 신뢰 ) 두 매크로 신호를 합쳐 매수/매도 결정
# ============================================================
gold_strategy:
  gold_symbol: "GC=F"           # 금 선물 (또는 GLD ETF)
  # 실질금리 프록시. yfinance 에는 실질금리 직접 시계열이 없어 10Y 국채금리(^TNX)를 기본 프록시로 사용.
  # 진짜 실질금리(FRED DFII10)를 쓰려면 source=csv 로 data/_TNX.csv 등에 넣어 교체할 수 있다.
  real_rate_symbol: "^TNX"
  dollar_symbol: "DX-Y.NYB"     # ICE 달러 인덱스 (대안: DX=F, UUP)

  signal:
    lookback: 60                # z-score 산출 윈도우(거래일)
    momentum_window: 10         # 추세(모멘텀) 계산 윈도우
    level_weight: 0.4           # 신호 내 '수준' 비중
    momentum_weight: 0.6        # 신호 내 '모멘텀' 비중
    weight_real_rate: 0.5       # 실질금리 신호 가중
    weight_dollar: 0.5          # 달러 신호 가중
    entry_threshold: 0.4        # |표준화 점수| 이 값 초과 시 진입
    allow_short: true           # true: 매도=숏, false: 매도=현금보유

  backtest:
    cost_bps: 1.0               # 포지션 변경 시 거래비용(편도, bps)

output_dir: "outputs"
